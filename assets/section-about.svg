<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 150 40" width="150" height="40" role="img" aria-label="About me">
  <!-- Label defaults to the light theme and inverts on prefers-color-scheme.
       The previous near-white fill was invisible on GitHub's light theme. -->
  <style>
    .lbl { fill: #1A2233 }
    @media (prefers-color-scheme: dark) { .lbl { fill: #F0F4F9 } }
  </style>
  <rect x="0" y="19" width="40" height="3" rx="1.5" fill="#AB7249" />
  <text class="lbl" x="54" y="28" font-family="Amaranth, 'Trebuchet MS', 'Segoe UI', Verdana, sans-serif" font-size="20" font-weight="700" fill="#1A2233">About me</text>
</svg>
