<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 170" width="420" height="170" role="img" aria-label="Adaptly — read a document in a language you don't speak, using Chrome's built-in AI. React. Live site.">
  <style>
    .ttl { fill: #1A2233 }
    .dsc { fill: #5A6577 }
    .acc { fill: #8B5B33 }
    .brd { stroke: #8B5B33; stroke-opacity: .38 }
    .chp { stroke: #8B5B33; stroke-opacity: .30 }
    @media (prefers-color-scheme: dark) {
      .ttl { fill: #F0F4F9 }
      .dsc { fill: #98A3B4 }
      .acc { fill: #C99B6E }
      .brd { stroke: #C1AA8B; stroke-opacity: .34 }
      .chp { stroke: #C1AA8B; stroke-opacity: .26 }
    }
  </style>

  <rect class="brd" x="0.75" y="0.75" width="418.5" height="168.5" rx="14" fill="none" stroke="#8B5B33" stroke-opacity="0.38" stroke-width="1.5" />

  <text class="ttl" x="28" y="48" font-family="Amaranth, 'Trebuchet MS', 'Segoe UI', Verdana, sans-serif" font-size="21" font-weight="700" fill="#1A2233">Adaptly</text>
  <text class="acc" x="392" y="45" text-anchor="end" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Consolas, monospace" font-size="10.5" letter-spacing="1" fill="#8B5B33">LIVE ↗</text>

  <text class="dsc" x="28" y="82" font-family="Lora, Georgia, 'Times New Roman', serif" font-size="13.5" fill="#5A6577">Read a document in a language you don't</text>
  <text class="dsc" x="28" y="102" font-family="Lora, Georgia, 'Times New Roman', serif" font-size="13.5" fill="#5A6577">speak, using Chrome's built-in AI.</text>

  <g font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" text-anchor="middle">
    <rect class="chp" x="28" y="126" width="62" height="26" rx="13" fill="none" stroke="#8B5B33" stroke-opacity="0.30" />
    <text class="acc" x="59" y="143" fill="#8B5B33">React</text>
    <rect class="chp" x="98" y="126" width="148" height="26" rx="13" fill="none" stroke="#8B5B33" stroke-opacity="0.30" />
    <text class="acc" x="172" y="143" fill="#8B5B33">Chrome built-in AI</text>
  </g>
</svg>
