  <text x="392" y="45" text-anchor="end" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Consolas, monospace" font-size="10.5" letter-spacing="1" fill="#C08A5E">LIVE ↗</text>

  <text x="28" y="82" font-family="Lora, Georgia, 'Times New Roman', serif" font-size="13.5" fill="#8494AB">A hospital site built for people who are</text>
